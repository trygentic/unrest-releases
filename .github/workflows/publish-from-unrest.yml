name: publish-from-unrest

# Takes the packages a self-hosted build produced in the private
# trygentic/unrest repository and puts them on this repository's Releases page
# as a DRAFT. Nothing is built here, so no private source or build log appears
# in this public repository. A person marks the draft public after a smoke test.
#
# The build machines never hold a token that can write here: this job runs on a
# clean GitHub machine, reads the finished packages, and uses this repository's
# own token to create the draft.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID of a successful "Release (self-hosted)" run on main in trygentic/unrest.'
        required: true
        type: string
      tag:
        description: 'Release tag to create as a draft (e.g. v0.25.0-beta.1).'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  draft-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      SOURCE: trygentic/unrest
      RUN_ID: ${{ inputs.run_id }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Validate inputs
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::run_id must be a number"; exit 1; }
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::tag must look like v1.2.3 or v1.2.3-beta.1"; exit 1; }

      - name: Mint a read-only token for the build
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: read
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: trygentic
          repositories: unrest
          permission-actions: read
          permission-contents: read

      # Only a finished, successful run of the release workflow on main counts.
      - name: Verify the build and download its packages
        env:
          GH_TOKEN: ${{ steps.read.outputs.token }}
        run: |
          set -euo pipefail
          run=$(gh api "repos/$SOURCE/actions/runs/$RUN_ID")
          check() { test "$(jq -r "$1" <<<"$run")" = "$2" || { echo "::error::run $RUN_ID: $1 is not $2"; exit 1; }; }
          check .path .github/workflows/release-selfhosted.yml
          check .head_branch main
          check .event workflow_dispatch
          check .status completed
          check .conclusion success
          jq -r .head_sha <<<"$run" > source-sha
          mkdir packages
          gh run download "$RUN_ID" --repo "$SOURCE" --dir download
          find download -type f -exec mv {} packages/ \;
          ls -l packages

      # A draft is visible only to people with write access to this repository.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(cat source-sha)
          cd packages
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          gh release create "$TAG" * \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --draft --prerelease \
            --title "Unrest ${TAG#v}" \
            --notes "Unsigned beta build (source ${sha::10}). macOS: right-click the app and choose Open the first time. Check downloads against SHA256SUMS before running them."
