name: release

# Builds GameGen and the Unrest Launcher from the private trygentic/unrest
# source and collects the packages into a DRAFT release in this repository.
#
# GameGen is the slow part. It can be built here, or on our own machines by
# "Release (self-hosted)" in trygentic/unrest and handed over with
# `gamegen_run_id`. Either way the launcher is built here and all signing
# happens here, so the signing keys never leave this repository's secrets.
# Nothing here publishes: a person marks the draft public after a smoke test.
#
# This repository is public, so these logs are public. The build prints no
# secrets, and compiler warnings are capped so private source is not quoted,
# but a failing build can still show file names and error lines.
#
# There are two separate kinds of signing. Each switches on by itself once its
# settings exist in this repository, and a run without them behaves as before.
#
# 1. Apple signing and notarization of the two macOS apps, so they open without
#    a Gatekeeper warning. Needs all five secrets:
#      MAC_CERT_P12, MAC_CERT_PASSWORD                         the Developer ID certificate
#      APPLE_API_KEY_P8, APPLE_API_KEY_ID, APPLE_API_ISSUER    the notarization key
#    The steps are in .github/scripts/apple-sign.sh. If Apple rejects an app the
#    job fails and prints Apple's log; nothing unsigned is released in its place.
#    Windows apps are not signed by Microsoft yet (see the placeholder below).
#
# 2. Our own update signing, which is what an installed launcher checks:
#      variables  UNREST_UPDATER_PUBLIC_KEY, UNREST_PRODUCT_PUBLIC_KEY
#      secrets    UNREST_UPDATER_PRIVATE_KEY, UNREST_PRODUCT_PRIVATE_KEY
#                 (and the matching *_PASSWORD secrets if the keys have one)
#    With them, a tagged run signs the GameGen archives, compiles the list of
#    those archives into the launcher, and signs the launcher's update archives.
#
# ORDER MATTERS. Apple signing changes an app's bytes, and everything in (2) is
# a hash or signature of exact bytes. So each app is Apple-signed first and
# only then archived, hashed and signed for the launcher:
#
#   gamegen           build GameGen (or gamegen-prebuilt: fetch it)
#   gamegen-apple     Apple-sign GameGen.app, notarize, staple, re-archive
#   catalog           hash and sign the FINAL GameGen archives; write the product list
#   launcher          compile that list in; build; Apple-sign Unrest.app,
#                     notarize, staple; only then make the ZIP and update archive
#   draft-release     sign the FINAL launcher update archives; latest.json; draft
#
# No private key is ever present in a build step. The Apple certificate lives in
# a temporary keychain that an always-run step deletes.

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Ref in trygentic/unrest to build: main, a v* tag, or a commit SHA.'
        required: false
        type: string
        default: 'main'
      tag:
        description: 'Release tag to create as a draft. Must be v<launcher version at source_ref> (e.g. v0.1.0); v0.0.N-test.N for a throwaway trial. Leave empty to build without creating a release.'
        required: false
        type: string
      gamegen_run_id:
        description: 'Optional. Run ID of a successful "Release (self-hosted)" run on main in trygentic/unrest. GameGen is then taken from that run instead of being built here; the launcher is still built, and everything is signed, here.'
        required: false
        type: string
      platforms:
        description: 'Which platforms this release ships. "macos": no Windows GameGen and no Windows launcher are built, listed or released.'
        required: false
        type: choice
        options:
          - all
          - macos
        default: all
      skip_apple_signing:
        description: 'Ship the macOS apps WITHOUT Apple signing even though the Apple settings exist. Only for a deliberate unsigned build; users will see a Gatekeeper warning.'
        required: false
        type: boolean
        default: false

# The source checkout uses a token minted from the release bot GitHub App.
# GITHUB_TOKEN is read-only everywhere except the one job that drafts a release.
permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.run_id }}
  cancel-in-progress: false

env:
  SOURCE_REPO: trygentic/unrest
  # Do not echo private source in public logs through warnings.
  RUSTFLAGS: --cap-lints allow
  CARGO_TERM_COLOR: never
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      apple: ${{ steps.apple.outputs.apple }}
      launcher_version: ${{ steps.check.outputs.launcher_version }}
      gamegen_version: ${{ steps.check.outputs.gamegen_version }}
    steps:
      # An arbitrary branch would run its build scripts with the source token
      # in scope, so only main, release tags and exact commits are accepted.
      - name: Validate inputs
        env:
          REF: ${{ inputs.source_ref }}
          TAG: ${{ inputs.tag }}
          RUN: ${{ inputs.gamegen_run_id }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          if [[ "$REF" != "main" && ! "$REF" =~ ^v[0-9] && ! "$REF" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "::error::source_ref must be main, a v* tag or a commit SHA"; exit 1
          fi
          if [[ -n "$TAG" && ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::tag must look like v1.2.3 or v1.2.3-beta.1"; exit 1
          fi
          if [[ -n "$RUN" && ! "$RUN" =~ ^[0-9]+$ ]]; then
            echo "::error::gamegen_run_id must be a number"; exit 1
          fi
          if [[ "$PLATFORMS" == "macos" ]]; then
            echo "Platforms in this run: macOS (Apple Silicon) only. No Windows GameGen and no Windows launcher."
            echo "::notice::macOS-only release: nothing for Windows is built, listed or released."
          else
            echo "Platforms in this run: macOS (Apple Silicon) and Windows (x64)."
          fi

      # Apple signing needs all five settings. None: the apps ship unsigned, as
      # before. Some but not all: stop now rather than find out after the build.
      # Only "is it set" reaches this step, never a value.
      - name: See whether Apple signing is configured
        id: apple
        env:
          SKIP: ${{ inputs.skip_apple_signing }}
          HAS_MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 != '' }}
          HAS_MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD != '' }}
          HAS_APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 != '' }}
          HAS_APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID != '' }}
          HAS_APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER != '' }}
        run: |
          missing=(); present=0
          for name in MAC_CERT_P12 MAC_CERT_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            has="HAS_$name"
            if [[ "${!has}" == "true" ]]; then present=$((present + 1)); else missing+=("$name"); fi
          done
          if [[ "$SKIP" == "true" ]]; then
            echo "::warning::skip_apple_signing is set: the macOS apps will NOT be signed by Apple."
          elif [[ $present -eq 5 ]]; then
            echo "apple=yes" >> "$GITHUB_OUTPUT"
            echo "Apple signing and notarization: on."
          elif [[ $present -eq 0 ]]; then
            echo "Apple signing is not configured: the macOS apps will not be signed by Apple."
          else
            echo "::error::Apple signing is half configured. Missing secrets: ${missing[*]}. Add them, or remove all five."; exit 1
          fi

      - name: Mint a read-only token for the source
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: source
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: trygentic
          repositories: unrest
          permission-actions: read
          permission-contents: read

      # The versions are read from the commit that will be built: the
      # self-hosted run's commit when GameGen comes from there.
      - name: Find the commit to check
        id: ref
        env:
          GH_TOKEN: ${{ steps.source.outputs.token }}
          REF: ${{ inputs.source_ref }}
          RUN: ${{ inputs.gamegen_run_id }}
        run: |
          set -euo pipefail
          if [[ -n "$RUN" ]]; then
            echo "ref=$(gh api "repos/$SOURCE_REPO/actions/runs/$RUN" --jq .head_sha)" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$REF" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the version files and the release check
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ steps.source.outputs.token }}
          ref: ${{ steps.ref.outputs.ref }}
          persist-credentials: false
          sparse-checkout: |
            unrest-launcher/scripts/release
            unrest-launcher/src/products/unrest/native
            agentloop/src/products/gamegen

      # The rules live in the source, with tests: unrest-launcher/scripts/release/check-release.mjs.
      #   - the tag is v<launcher version> (v0.0.N-test.N is a throwaway trial)
      #   - this GameGen version is not already in a published release
      #   - no published release has this tag
      # Published releases are enough for these checks, so a read-only token will do.
      - name: Check the tag and the versions
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          script=unrest-launcher/scripts/release/check-release.mjs
          test -f "$script" || { echo "::error::This source has no release check ($script). Build a newer commit."; exit 1; }
          # A macOS-only release needs the source's macOS-only update manifest.
          # Find out now, not after an hour of building.
          if [[ "$PLATFORMS" == "macos" ]] && ! grep -q -- '--macos-only' unrest-launcher/scripts/release/create-launcher-manifest.ts; then
            echo "::error::This source cannot write a macOS-only update manifest (create-launcher-manifest.ts has no --macos-only). Build a newer commit."; exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
            --jq '.[] | {tag_name, draft, assets: [.assets[] | {name}]}' | jq -s . > "$RUNNER_TEMP/releases.json"
          status=0
          node "$script" --tag="$TAG" --releases="$RUNNER_TEMP/releases.json" | tee "$RUNNER_TEMP/check.txt" || status=$?
          grep -E '^(launcher|gamegen)_version=[0-9A-Za-z.-]+$' "$RUNNER_TEMP/check.txt" >> "$GITHUB_OUTPUT" || true
          exit "$status"

  gamegen:
    needs: validate
    if: ${{ inputs.gamegen_run_id == '' }}
    name: GameGen ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        # macOS always; Windows unless this is a macOS-only release
        # (`platforms: macos`). Each entry: the runner, the Rust target, the
        # folder key the packager uses, and the executable suffix.
        include: >-
          ${{ fromJSON(inputs.platforms == 'macos'
          && '[{"runner":"macos-15","target":"aarch64-apple-darwin","key":"darwin-arm64","exe":""}]'
          || '[{"runner":"macos-15","target":"aarch64-apple-darwin","key":"darwin-arm64","exe":""},{"runner":"windows-latest","target":"x86_64-pc-windows-msvc","key":"win32-x64","exe":".exe"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - name: Mint a read-only token for the source
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: source
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: trygentic
          repositories: unrest
          permission-contents: read

      - name: Check out the source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ steps.source.outputs.token }}
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
          sparse-checkout: |
            agentloop
            agentloop-memory
            scallop
            packages

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 25.8.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          targets: ${{ matrix.target }}
      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      # v8's build script needs Cargo's home on the same drive as the build.
      # The CRT folder is copied beside the app so it starts on a clean PC.
      - name: Windows build settings
        if: runner.os == 'Windows'
        run: |
          echo "CARGO_HOME=$(cygpath -w "$RUNNER_TEMP/cargo-home")" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"
          vs=$("/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -property installationPath)
          crt=$(ls -d "$(cygpath -u "$vs")"/VC/Redist/MSVC/*/x64/Microsoft.VC*.CRT | sort | tail -1)
          echo "CRT folder: $crt"
          test -d "$crt"
          echo "AGENTLOOP_WINDOWS_CRT_DIR=$(cygpath -w "$crt")" >> "$GITHUB_ENV"

      # Compiled code records the full path of every source file. Rewrite the
      # machine-specific parts so no user name or folder layout ships.
      - name: Hide build-machine paths
        run: |
          home="$HOME"; work="$GITHUB_WORKSPACE"; cargo="${CARGO_HOME:-$HOME/.cargo}"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            home=$(cygpath -w "$home"); work=$(cygpath -w "$work"); cargo=$(cygpath -w "$cargo")
          fi
          echo "RUSTFLAGS=$RUSTFLAGS --remap-path-prefix=$home=~ --remap-path-prefix=$cargo=~/.cargo --remap-path-prefix=$work=/src" >> "$GITHUB_ENV"

      - name: Install locked dependencies
        working-directory: agentloop
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build the daemon and the memory helper
        working-directory: agentloop
        env:
          SCCACHE_GHA_ENABLED: 'true'
          RUSTC_WRAPPER: sccache
        run: |
          cargo build --locked --release --manifest-path crates/Cargo.toml -p agentloop-daemon
          cargo build --locked --release --manifest-path ../agentloop-memory/Cargo.toml -p am-server --bin agentloop-memory
          mkdir -p "build-extras/agentloop-daemon/${{ matrix.key }}" "build-extras/agentloop-memory/${{ matrix.key }}"
          cp "crates/target/release/agentloop-daemon${{ matrix.exe }}" "build-extras/agentloop-daemon/${{ matrix.key }}/"
          cp "../agentloop-memory/target/release/agentloop-memory${{ matrix.exe }}" "build-extras/agentloop-memory/${{ matrix.key }}/"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp crates/target/release/runtime_owner_lease.exe "build-extras/agentloop-daemon/${{ matrix.key }}/"
          fi

      # WINDOWS CODE SIGNING: NOT DONE YET. GameGen.exe and the launcher's
      # installer are not signed by Microsoft (Authenticode), so SmartScreen
      # warns. When a certificate exists, sign here for GameGen (before the
      # archive is made) and in the launcher job after "Package the launcher"
      # (before its artifact is uploaded): both must happen before `catalog` and
      # `draft-release` hash and sign the files, for the reason given at the top.

      # The packager refuses a tree with uncommitted changes, so the package
      # is always exactly the checked-out commit.
      - name: Package GameGen
        working-directory: agentloop
        env:
          SCCACHE_GHA_ENABLED: 'true'
          RUSTC_WRAPPER: sccache
        run: |
          git -C .. status --porcelain
          node scripts/package-gamegen-beta.mjs --target=${{ matrix.target }} --output="$RUNNER_TEMP/gamegen"
          mv "$RUNNER_TEMP/gamegen/gamegen-package.json" "$RUNNER_TEMP/gamegen/gamegen-package-${{ matrix.target }}.json"
          ls -l "$RUNNER_TEMP/gamegen"

      - name: Keep the package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gamegen-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/gamegen/*.tar.gz
            ${{ runner.temp }}/gamegen/gamegen-package-*.json
          if-no-files-found: error
          retention-days: 14

  gamegen-prebuilt:
    name: GameGen from a self-hosted build
    needs: validate
    if: ${{ inputs.gamegen_run_id != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.fetch.outputs.sha }}
    env:
      RUN_ID: ${{ inputs.gamegen_run_id }}
    steps:
      - name: Mint a read-only token for the build
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: read
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: trygentic
          repositories: unrest
          permission-actions: read
          permission-contents: read

      # Only a finished, successful run of the release workflow on main counts.
      - name: Verify the build and download its packages
        id: fetch
        env:
          GH_TOKEN: ${{ steps.read.outputs.token }}
        run: |
          set -euo pipefail
          run=$(gh api "repos/$SOURCE_REPO/actions/runs/$RUN_ID")
          check() { test "$(jq -r "$1" <<<"$run")" = "$2" || { echo "::error::run $RUN_ID: $1 is not $2"; exit 1; }; }
          check .path .github/workflows/release-selfhosted.yml
          check .head_branch main
          check .event workflow_dispatch
          check .status completed
          check .conclusion success
          echo "sha=$(jq -r .head_sha <<<"$run")" >> "$GITHUB_OUTPUT"
          gh run download "$RUN_ID" --repo "$SOURCE_REPO" --dir "$RUNNER_TEMP/gamegen"
          ls -lR "$RUNNER_TEMP/gamegen"

      # Re-published under the names the later jobs already expect.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gamegen-aarch64-apple-darwin
          path: ${{ runner.temp }}/gamegen/gamegen-aarch64-apple-darwin/
          if-no-files-found: error
          retention-days: 14
      # Not passed on in a macOS-only release, so nothing later can list or ship it.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ inputs.platforms != 'macos' }}
        with:
          name: gamegen-x86_64-pc-windows-msvc
          path: ${{ runner.temp }}/gamegen/gamegen-x86_64-pc-windows-msvc/
          if-no-files-found: error
          retention-days: 14

  # Apple-signs GameGen for macOS. It runs here, on GitHub's Mac, even when
  # GameGen was built on our own machines: the certificate never leaves this
  # repository's secrets. The signed package REPLACES the unsigned one under
  # the same artifact name, so every later job sees only the final bytes.
  gamegen-apple:
    name: Apple-sign GameGen
    needs: [validate, gamegen, gamegen-prebuilt]
    if: ${{ always() && needs.validate.outputs.apple == 'yes' && (needs.gamegen.result == 'success' || needs.gamegen-prebuilt.result == 'success') }}
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      TARGET: aarch64-apple-darwin
    steps:
      - name: Locate the signing script
        run: echo "SIGN=$GITHUB_WORKSPACE/releases/.github/scripts/apple-sign.sh" >> "$GITHUB_ENV"

      - name: Check out the signing script
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          path: releases
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Mint a read-only token for the source
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: source
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: trygentic
          repositories: unrest
          permission-contents: read

      # Only the script that re-archives the package and rewrites its receipt.
      - name: Check out the packaging tools
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ steps.source.outputs.token }}
          ref: ${{ needs.gamegen-prebuilt.outputs.sha || inputs.source_ref }}
          path: source
          persist-credentials: false
          sparse-checkout: agentloop/scripts

      - name: Fetch the unsigned package
        uses: actions/download-artifact@v5
        with:
          name: gamegen-${{ env.TARGET }}
          path: ${{ runner.temp }}/unsigned

      - name: Unpack it
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/unsigned/gamegen-package-$TARGET.json"
          root=$(jq -r .installLayout.root "$receipt")
          [[ "$root" =~ ^GameGen-[0-9A-Za-z.-]+-macos-[0-9a-z_]+$ ]] || { echo "::error::unexpected package root"; exit 1; }
          mkdir "$RUNNER_TEMP/work"
          tar -xzf "$RUNNER_TEMP/unsigned/$root.tar.gz" -C "$RUNNER_TEMP/work"
          test -d "$RUNNER_TEMP/work/$root/GameGen.app"
          echo "PRODUCT=$RUNNER_TEMP/work/$root" >> "$GITHUB_ENV"
          echo "RECEIPT=$receipt" >> "$GITHUB_ENV"

      # The only step that holds the certificate. It goes into a keychain that
      # exists for this job alone.
      - name: Import the Developer ID certificate
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: bash "$SIGN" import-cert

      # Inside-out: the daemon, the memory helper, the Node runtime and every
      # native add-on first, the app last. Helper programs get the entitlements
      # that let JavaScript engines run under the hardened runtime.
      - name: Sign GameGen.app
        run: bash "$SIGN" sign "$PRODUCT/GameGen.app" "$GITHUB_WORKSPACE/releases/.github/scripts/helper-entitlements.plist"

      # Fails the job, with Apple's log, if Apple says no.
      - name: Notarize and staple
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: bash "$SIGN" notarize "$PRODUCT/GameGen.app"

      - name: Verify the signed app
        run: bash "$SIGN" verify "$PRODUCT/GameGen.app"

      # New archive, new receipt (size, hash). Then check the archive itself:
      # what a user's launcher will unpack must still pass every check.
      - name: Re-archive the signed app
        run: |
          set -euo pipefail
          node source/agentloop/scripts/reseal-gamegen-package.mjs --receipt="$RECEIPT" --product="$PRODUCT" --output="$RUNNER_TEMP/signed"
          mkdir "$RUNNER_TEMP/recheck"
          tar -xzf "$RUNNER_TEMP/signed/$(basename "$PRODUCT").tar.gz" -C "$RUNNER_TEMP/recheck"
          bash "$SIGN" verify "$RUNNER_TEMP/recheck/$(basename "$PRODUCT")/GameGen.app"
          ls -l "$RUNNER_TEMP/signed"

      - name: Replace the unsigned package with the signed one
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gamegen-${{ env.TARGET }}
          path: ${{ runner.temp }}/signed/
          overwrite: true
          if-no-files-found: error
          retention-days: 14

      - name: Delete the keychain
        if: ${{ always() }}
        run: bash "$SIGN" cleanup

  catalog:
    name: Sign GameGen and list it for the launcher
    # After gamegen-apple: these hashes and signatures must be of the archives
    # as they ship. If Apple signing was wanted and failed, this does not run.
    needs: [gamegen, gamegen-prebuilt, gamegen-apple]
    # Signed product lists only make sense for a real, tagged release.
    if: ${{ always() && inputs.tag != '' && vars.UNREST_PRODUCT_PUBLIC_KEY != '' && (needs.gamegen.result == 'success' || needs.gamegen-prebuilt.result == 'success') && (needs.gamegen-apple.result == 'success' || needs.gamegen-apple.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Mint a read-only token for the source
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: source
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: trygentic
          repositories: unrest
          permission-contents: read

      - name: Check out the release tooling
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ steps.source.outputs.token }}
          ref: ${{ needs.gamegen-prebuilt.outputs.sha || inputs.source_ref }}
          persist-credentials: false
          sparse-checkout: |
            unrest-launcher
            packages
            agentloop/scripts

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'

      - name: Install the release tooling
        working-directory: unrest-launcher
        run: |
          bun install --frozen-lockfile --ignore-scripts
          npm ci --prefix scripts/tauri-toolchain --ignore-scripts --no-audit --no-fund

      - uses: actions/download-artifact@v5
        with:
          pattern: gamegen-*
          path: ${{ runner.temp }}/gamegen
          merge-multiple: true

      # The only step that holds the product key. The signer prints key
      # material, so its output is discarded.
      - name: Sign the GameGen archives
        working-directory: unrest-launcher
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.UNREST_PRODUCT_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.UNREST_PRODUCT_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for archive in "$RUNNER_TEMP"/gamegen/*.tar.gz; do
            node scripts/tauri-toolchain/node_modules/@tauri-apps/cli/tauri.js signer sign "$archive" >/dev/null 2>&1 \
              || { echo "::error::could not sign $(basename "$archive")"; exit 1; }
            test -s "$archive.sig"
          done

      # Each entry is built from the package's own receipt and its exact bytes.
      - name: Build the product list
        working-directory: unrest-launcher
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/gamegen"
          echo '[]' > "$RUNNER_TEMP/input.json"
          for receipt in "$dir"/gamegen-package-*.json; do
            name=$(jq -r '.archive | split("/") | last | split("\\") | last' "$receipt")
            jq --arg archive "$dir/$name" '.archive = $archive' "$receipt" > "$receipt.local"
            jq --arg receipt "$receipt.local" --arg sig "$dir/$name.sig" \
               --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$name" \
               '. + [{receipt: $receipt, signatureFile: $sig, url: $url, generationRelativeResourcesVerified: true}]' \
               "$RUNNER_TEMP/input.json" > "$RUNNER_TEMP/input.next" && mv "$RUNNER_TEMP/input.next" "$RUNNER_TEMP/input.json"
          done
          bun scripts/release/create-gamegen-test-catalog.ts "$RUNNER_TEMP/input.json" "$RUNNER_TEMP/products-v1.json"
          bun scripts/release/validate-product-catalog.ts "$RUNNER_TEMP/products-v1.json"
          mkdir "$RUNNER_TEMP/catalog"
          cp "$RUNNER_TEMP/products-v1.json" "$dir"/*.sig "$RUNNER_TEMP/catalog/"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: catalog
          path: ${{ runner.temp }}/catalog/
          if-no-files-found: error
          retention-days: 14

  launcher:
    # Runs after the product list when there is one, and without it otherwise.
    needs: [validate, catalog, gamegen-prebuilt, gamegen-apple]
    if: ${{ always() && needs.validate.result == 'success' && (needs.catalog.result == 'success' || needs.catalog.result == 'skipped') && needs.gamegen-prebuilt.result != 'failure' && (needs.gamegen-apple.result == 'success' || needs.gamegen-apple.result == 'skipped') }}
    name: Launcher ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        # macOS always; Windows unless this is a macOS-only release.
        include: >-
          ${{ fromJSON(inputs.platforms == 'macos'
          && '[{"runner":"macos-15","target":"aarch64-apple-darwin"}]'
          || '[{"runner":"macos-15","target":"aarch64-apple-darwin"},{"runner":"windows-latest","target":"x86_64-pc-windows-msvc"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
        working-directory: unrest-launcher
    env:
      # "yes" only on the Mac, and only when Apple signing is configured.
      APPLE: ${{ matrix.target == 'aarch64-apple-darwin' && needs.validate.outputs.apple || '' }}
    steps:
      # Outside the checkout, so the build output is easy to find and upload.
      - name: Choose the build folder
        working-directory: ${{ github.workspace }}
        run: |
          {
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/launcher-target"
            # Used by the Apple signing steps further down.
            echo "APP=$RUNNER_TEMP/launcher-target/${{ matrix.target }}/release/bundle/macos/Unrest.app"
            echo "SIGN=$GITHUB_WORKSPACE/release-tools/.github/scripts/apple-sign.sh"
          } >> "$GITHUB_ENV"

      - name: Mint a read-only token for the source
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: source
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: trygentic
          repositories: unrest
          permission-contents: read

      - name: Check out the source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ steps.source.outputs.token }}
          ref: ${{ needs.gamegen-prebuilt.outputs.sha || inputs.source_ref }}
          persist-credentials: false
          # `packages` holds the shared UI packages the launcher depends on.
          # One launcher release check imports a helper from agentloop/scripts.
          sparse-checkout: |
            unrest-launcher
            packages
            agentloop/scripts

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Compiled code records the full path of every source file. Rewrite the
      # machine-specific parts so no user name or folder layout ships.
      - name: Hide build-machine paths
        working-directory: ${{ github.workspace }}
        run: |
          home="$HOME"; work="$GITHUB_WORKSPACE"; cargo="${CARGO_HOME:-$HOME/.cargo}"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            home=$(cygpath -w "$home"); work=$(cygpath -w "$work"); cargo=$(cygpath -w "$cargo")
          fi
          echo "RUSTFLAGS=$RUSTFLAGS --remap-path-prefix=$home=~ --remap-path-prefix=$cargo=~/.cargo --remap-path-prefix=$work=/src" >> "$GITHUB_ENV"

      - name: Install locked dependencies
        run: |
          bun install --frozen-lockfile --ignore-scripts
          npm ci --prefix scripts/tauri-toolchain --ignore-scripts --no-audit --no-fund

      - name: Check and build the launcher web bundle
        run: |
          bun run check
          bun run test:release
          bun scripts/release/validate-product-catalog.ts
          bun run build:beta:web
          bun run build:beta:icons

      - name: Fetch the product list
        if: ${{ needs.catalog.result == 'success' }}
        uses: actions/download-artifact@v5
        with:
          name: catalog
          path: ${{ runner.temp }}/catalog

      - name: Compile the product list into the launcher
        if: ${{ needs.catalog.result == 'success' }}
        run: cp "$RUNNER_TEMP/catalog/products-v1.json" src/products/unrest/native/products-v1.json

      # Only PUBLIC keys reach the build. `--updater` turns on self-update.
      - name: Package the launcher
        env:
          UNREST_UPDATER_PUBLIC_KEY: ${{ vars.UNREST_UPDATER_PUBLIC_KEY }}
          UNREST_PRODUCT_PUBLIC_KEY: ${{ needs.catalog.result == 'success' && vars.UNREST_PRODUCT_PUBLIC_KEY || '' }}
        run: |
          if [[ -n "$UNREST_UPDATER_PUBLIC_KEY" ]]; then
            bun scripts/package-beta.ts --target=${{ matrix.target }} --updater
          else
            unset UNREST_UPDATER_PUBLIC_KEY
            bun scripts/package-beta.ts --target=${{ matrix.target }}
          fi

      # ---- Apple signing (macOS only, when the five settings exist) ----
      # The build above made an unsigned Unrest.app and archived it. Sign the
      # app, have Apple notarize it, staple the ticket, then make the ZIP and
      # the update archive AGAIN from the signed app: `draft-release` signs the
      # update archive's exact bytes, so they must be the final ones.
      # After the source checkout (which cleans the folder), in a folder of its
      # own; the launcher build never looks there.
      - name: Check out the signing script
        if: ${{ env.APPLE == 'yes' }}
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          path: release-tools
          persist-credentials: false
          sparse-checkout: .github/scripts

      # The only step that holds the certificate.
      - name: Import the Developer ID certificate
        if: ${{ env.APPLE == 'yes' }}
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: bash "$SIGN" import-cert

      # The launcher holds no helper programs and needs no entitlements.
      - name: Sign Unrest.app
        if: ${{ env.APPLE == 'yes' }}
        run: bash "$SIGN" sign "$APP"

      # Fails the job, with Apple's log, if Apple says no.
      - name: Notarize and staple
        if: ${{ env.APPLE == 'yes' }}
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: bash "$SIGN" notarize "$APP"

      - name: Verify the signed app
        if: ${{ env.APPLE == 'yes' }}
        run: bash "$SIGN" verify "$APP"

      # Same archives as the build made, now of the signed app. Then unpack the
      # ZIP and check that what a user downloads still passes every check.
      - name: Re-archive the signed app
        if: ${{ env.APPLE == 'yes' }}
        env:
          UNREST_UPDATER_PUBLIC_KEY: ${{ vars.UNREST_UPDATER_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [[ -n "$UNREST_UPDATER_PUBLIC_KEY" ]]; then
            bun scripts/package-beta.ts --target=${{ matrix.target }} --updater --archive-only
          else
            unset UNREST_UPDATER_PUBLIC_KEY
            bun scripts/package-beta.ts --target=${{ matrix.target }} --archive-only
          fi
          mkdir "$RUNNER_TEMP/recheck"
          /usr/bin/ditto -x -k "$(dirname "$APP")"/*.zip "$RUNNER_TEMP/recheck"
          bash "$SIGN" verify "$RUNNER_TEMP/recheck/Unrest.app"

      - name: Delete the keychain
        if: ${{ always() && env.APPLE == 'yes' }}
        run: bash "$SIGN" cleanup

      # WINDOWS CODE SIGNING: NOT DONE YET. Sign the NSIS installer here,
      # before it is uploaded (see the note in the GameGen job).

      # macOS: the zipped app, plus its update archive when updates are on.
      # Windows: the NSIS installer, which is also the update archive.
      - name: Keep the package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: launcher-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/launcher-target/${{ matrix.target }}/release/bundle/macos/*.zip
            ${{ runner.temp }}/launcher-target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            ${{ runner.temp }}/launcher-target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Draft release
    needs: [validate, gamegen, gamegen-prebuilt, gamegen-apple, launcher, catalog]
    # A failed Apple signing stops the release: nothing ships unsigned by accident.
    if: ${{ always() && inputs.tag != '' && (needs.gamegen.result == 'success' || needs.gamegen-prebuilt.result == 'success') && (needs.gamegen-apple.result == 'success' || needs.gamegen-apple.result == 'skipped') && needs.launcher.result == 'success' && (needs.catalog.result == 'success' || needs.catalog.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ inputs.tag }}
      SIGN_UPDATES: ${{ vars.UNREST_UPDATER_PUBLIC_KEY != '' && 'yes' || '' }}
      APPLE: ${{ needs.validate.outputs.apple }}
      LAUNCHER_VERSION: ${{ needs.validate.outputs.launcher_version }}
      # "macos": the release holds nothing for Windows, and no step may expect it.
      PLATFORMS: ${{ inputs.platforms }}
    steps:
      - name: Collect the packages
        uses: actions/download-artifact@v5
        with:
          path: packages
          merge-multiple: true

      # The launcher packages arrive in subfolders (macos/, nsis/): an artifact
      # made from several paths keeps the folders below their common parent.
      # Every later step, and the release itself, wants one flat folder. Move
      # everything up, refuse two files with one name, then check that every
      # file a release needs is there, by name, before anything is signed.
      - name: Lay the packages out flat and check them
        run: |
          set -euo pipefail
          cd packages
          find . -mindepth 2 -type f -print0 | while IFS= read -r -d '' file; do
            name=$(basename "$file")
            if [[ -e "$name" ]]; then echo "::error::two packages are both named $name ($file)"; exit 1; fi
            mv "$file" "$name"
          done
          find . -mindepth 1 -type d -empty -delete
          missing=0
          need() { # description, then a glob that must match exactly one file
            local what="$1" pattern="$2" found
            found=$(find . -maxdepth 1 -type f -name "$pattern" | wc -l | tr -d ' ')
            if [[ "$found" != "1" ]]; then
              echo "::error::expected exactly one $what ($pattern) in the packages, found $found"; missing=1
            fi
          }
          need "macOS launcher ZIP" 'Unrest_*-inspection.zip'
          if [[ "$SIGN_UPDATES" == "yes" ]]; then need "macOS launcher update archive" 'Unrest.app.tar.gz'; fi
          need "macOS GameGen receipt" 'gamegen-package-*-apple-darwin.json'
          if [[ "$PLATFORMS" == "macos" ]]; then
            # A macOS-only release must hold nothing for Windows at all.
            stray=$(find . -maxdepth 1 -type f \( -name '*.exe' -o -name '*windows*' \) | sort)
            if [[ -n "$stray" ]]; then echo "::error::a macOS-only release must not hold Windows files: $(echo "$stray" | tr '\n' ' ')"; missing=1; fi
          else
            need "Windows launcher installer" 'Unrest_*-setup.exe'
            need "Windows GameGen receipt" 'gamegen-package-*-windows-msvc.json'
          fi
          # Each receipt names its archive; a product list implies its signature too.
          for receipt in gamegen-package-*.json; do
            [[ -f "$receipt" ]] || continue
            archive="$(jq -r .installLayout.root "$receipt").tar.gz"
            if [[ ! -f "$archive" ]]; then echo "::error::$receipt describes $archive, which is not in the packages"; missing=1; fi
            if [[ -f products-v1.json && ! -f "$archive.sig" ]]; then echo "::error::the product list is here but $archive.sig is not"; missing=1; fi
          done
          echo "The packages:"
          ls -l
          if [[ "$missing" != "0" ]]; then echo "::error::the packages are incomplete; see the messages above and the listing"; exit 1; fi

      - name: Mint a read-only token for the source
        if: ${{ env.SIGN_UPDATES == 'yes' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: source
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: trygentic
          repositories: unrest
          permission-contents: read

      - name: Check out the release tooling
        if: ${{ env.SIGN_UPDATES == 'yes' }}
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ steps.source.outputs.token }}
          ref: ${{ needs.gamegen-prebuilt.outputs.sha || inputs.source_ref }}
          path: source
          persist-credentials: false
          sparse-checkout: |
            unrest-launcher
            packages
            agentloop/scripts

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: ${{ env.SIGN_UPDATES == 'yes' }}
        with:
          bun-version: 1.3.10

      - name: Install the release tooling
        if: ${{ env.SIGN_UPDATES == 'yes' }}
        working-directory: source/unrest-launcher
        run: |
          bun install --frozen-lockfile --ignore-scripts
          npm ci --prefix scripts/tauri-toolchain --ignore-scripts --no-audit --no-fund

      # The only step that holds the launcher's update key. Each signature
      # names the version, so an old archive cannot be relabelled as a new one.
      - name: Sign the launcher's update archives
        if: ${{ env.SIGN_UPDATES == 'yes' }}
        working-directory: source/unrest-launcher
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.UNREST_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.UNREST_UPDATER_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          version=$(jq -r .version package.json)
          # macOS: the app archive. Windows: the installer, unless this release has none.
          archives=("$GITHUB_WORKSPACE/packages/Unrest.app.tar.gz")
          if [[ "$PLATFORMS" != "macos" ]]; then archives+=("$GITHUB_WORKSPACE"/packages/*-setup.exe); fi
          for archive in "${archives[@]}"; do
            if [[ ! -f "$archive" ]]; then
              echo "::error::update archive not found: $archive"; ls -l "$GITHUB_WORKSPACE/packages"; exit 1
            fi
            node scripts/tauri-toolchain/node_modules/@tauri-apps/cli/tauri.js signer sign --app-version "$version" "$archive" >/dev/null 2>&1 \
              || { echo "::error::could not sign $(basename "$archive")"; exit 1; }
            if [[ ! -s "$archive.sig" ]]; then
              echo "::error::the signer wrote no $(basename "$archive").sig"; ls -l "$GITHUB_WORKSPACE/packages"; exit 1
            fi
          done

      # `latest.json` is what an installed launcher reads to find its update.
      # It ships inside this draft; moving it to the live `beta` channel is a
      # separate, deliberate step after the smoke test.
      - name: Write the launcher update manifest
        if: ${{ env.SIGN_UPDATES == 'yes' }}
        working-directory: source/unrest-launcher
        run: |
          set -euo pipefail
          p="$GITHUB_WORKSPACE/packages"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          mac=$(jq -n --arg p "$p" --arg base "$base" \
            '{platform: "darwin-aarch64", artifact: ($p + "/Unrest.app.tar.gz"), signatureFile: ($p + "/Unrest.app.tar.gz.sig"), url: ($base + "/Unrest.app.tar.gz")}')
          if [[ "$PLATFORMS" == "macos" ]]; then
            # Only the macOS entry. A launcher on another platform finds no
            # update for itself in this file and stays as it is.
            jq -n --argjson mac "$mac" '[$mac]' > "$RUNNER_TEMP/artifacts.json"
            only="--macos-only"
          else
            exe=$(basename "$p"/*-setup.exe)
            jq -n --argjson mac "$mac" --arg p "$p" --arg base "$base" --arg exe "$exe" \
              '[$mac, {platform: "windows-x86_64", artifact: ($p + "/" + $exe), signatureFile: ($p + "/" + $exe + ".sig"), url: ($base + "/" + $exe)}]' > "$RUNNER_TEMP/artifacts.json"
            only=""
          fi
          bun scripts/release/create-launcher-manifest.ts "$RUNNER_TEMP/artifacts.json" "$(jq -r .version package.json)" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$p/latest.json" $only

      # A draft is visible only to people with write access to this repository.
      # Marking it public is a manual step after the smoke test.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd packages
          ls -l
          # Covers the files of this run. A file added to the release later is
          # not in it: add its line by hand (see the runbook, "Adding a file to
          # the draft"). Nothing here ever removes or replaces a release asset.
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          # The tag names the launcher release; GameGen's own version comes
          # from the packages themselves.
          gamegen=$(jq -r .version gamegen-package-*.json | sort -u | paste -sd, -)
          if [[ "$PLATFORMS" == "macos" ]]; then
            platforms="For macOS (Apple Silicon). A Windows version is coming; this release has no Windows downloads."
            if [[ "$APPLE" == "yes" ]]; then signing="The apps are signed and notarized by Apple."
            else signing="Not yet signed by Apple: right-click the app and choose Open the first time."; fi
          else
            platforms="For macOS (Apple Silicon) and Windows (x64)."
            if [[ "$APPLE" == "yes" ]]; then
              signing="The macOS apps are signed and notarized by Apple. The Windows apps are not signed by Microsoft yet: SmartScreen will warn; choose More info, then Run anyway."
            else
              signing="Not yet signed by Apple or Microsoft. macOS: right-click the app and choose Open the first time. Windows: SmartScreen will warn; choose More info, then Run anyway."
            fi
          fi
          gh release create "$TAG" * \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --draft --prerelease \
            --title "Unrest ${TAG#v}" \
            --notes "Beta build. Unrest Launcher ${LAUNCHER_VERSION:-${TAG#v}} with GameGen ${gamegen}. ${platforms} ${signing} Check downloads against SHA256SUMS before running them."
